{% extends "base.html" %}

{% block content %}

<h1>Dashboard Domestic Energy</h1>
<p>Benvenuto nella tua applicazione.</p>

<form method="POST">
    <select name="device_id" id="device_select">
        <option value="">-- Seleziona un elettrodomestico --</option>

        {% for category in categories %}
            <optgroup label="{{ category.name }}">
                {% for device in category.devices %}
                    <option value="{{ device.id }}">
                        {{ device.name }}
                    </option>
                {% endfor %}
            </optgroup>
        {% endfor %}
    </select>
</form>

<p>Watt: <span id="device_watts">-</span></p>
<p>Standby watt: <span id="device_standby">-</span></p>

<script>
const select = document.getElementById("device_select");

select.addEventListener("change", async function () {
    const deviceId = this.value;

    if (!deviceId) {
        document.getElementById("device_watts").textContent = "-";
        document.getElementById("device_standby").textContent = "-";
        return;
    }

    try {
        const response = await fetch(`/device/${deviceId}`);

        if (!response.ok) {
            throw new Error("Errore nel recupero del dispositivo");
        }

        const data = await response.json();

        document.getElementById("device_watts").textContent = data.average_watts;
        document.getElementById("device_standby").textContent = data.standby_watts;

    } catch (error) {
        console.error(error);
        document.getElementById("device_watts").textContent = "Errore";
        document.getElementById("device_standby").textContent = "Errore";
    }
});
</script>

{% endblock %}
