{% extends "layout/base.html" %}

{% block content %}
<div class="container py-5">

    <!-- Titolo -->
    <div class="row mb-4">
        <div class="col text-center">
            <h1 class="fw-bold">Dashboard Domestic Energy</h1>
            <p class="text-muted">Seleziona un elettrodomestico per visualizzare i consumi</p>
        </div>
    </div>

    <!-- Select -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-3">
                <label for="device_select" class="form-label fw-semibold">
                    Seleziona elettrodomestico
                </label>

                <select name="device_id" id="device_select" class="form-select form-select-lg">
                    <option value="">-- Seleziona un elettrodomestico --</option>

                    {% for category in categories %}
                        <optgroup label="{{ category.name }}">
                            {% for device in category.devices %}
                                <option value="{{ device.id }}">
                                    {{ device.name }}
                                </option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- Risultati -->
    <div class="row g-4 justify-content-center">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4 text-center p-4 h-100">
                <div class="card-body">
                    <h5 class="text-muted mb-2">Consumo medio</h5>
                    <div class="fs-2 fw-bold text-success" id="device_watts">
                        -
                    </div>
                    <small class="text-muted">Watt</small>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4 text-center p-4 h-100">
                <div class="card-body">
                    <h5 class="text-muted mb-2">Consumo standby</h5>
                    <div class="fs-2 fw-bold text-warning" id="device_standby">
                        -
                    </div>
                    <small class="text-muted">Watt</small>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- JS -->
<script>
const select = document.getElementById("device_select");

select.addEventListener("change", async function () {
    const deviceId = this.value;

    if (!deviceId) {
        document.getElementById("device_watts").textContent = "-";
        document.getElementById("device_standby").textContent = "-";
        return;
    }

    try {
        const response = await fetch(`/device/${deviceId}`);

        if (!response.ok) {
            throw new Error("Errore nel recupero del dispositivo");
        }

        const data = await response.json();

        document.getElementById("device_watts").textContent = data.average_watts;
        document.getElementById("device_standby").textContent = data.standby_watts;

    } catch (error) {
        console.error(error);
        document.getElementById("device_watts").textContent = "Errore";
        document.getElementById("device_standby").textContent = "Errore";
    }
});
</script>

{% endblock %}
