{% extends "base.html" %}

{% block content %}
<table>
    <thead>
        <tr>
            <th>Codice</th>
            <th>Paese</th>
            <th>Dato</th>
        </tr>
    </thead>
    <tbody>
        {% for d in data %}
        <tr>
            <td>{{ d.codice }}</td>
            <td>{{ d.nome_paese }}</td>
            <td>{{ d.dato }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{%endblock%}
